name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Build release APKs (split-per-ABI)
        run: flutter build apk --release --split-per-abi
      - name: Verify APKs
        run: |
          echo "=== APK outputs ==="
          ls -lh build/app/outputs/flutter-apk/
          echo "=== Size check (<40MB each) ==="
          for apk in build/app/outputs/flutter-apk/*.apk; do
            size=$(stat -c%s "$apk")
            echo "$apk : $size bytes"
            if [ "$size" -gt 41943040 ]; then
              echo "::warning ::$apk exceeds 40MB target"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-14
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build ios --release --no-codesign
