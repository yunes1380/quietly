name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Build release APKs - Android 16 (API 36)
        continue-on-error: true
        run: flutter build apk --release --split-per-abi -v
      - name: Locate + verify APKs
        run: |
          echo "=== Searching for APKs ==="
          find . -name "*.apk" -type f 2>/dev/null | head -n 20
          echo "=== build/ tree ==="
          find build -type f 2>/dev/null | head -n 30 || true
          echo "=== android build outputs ==="
          find android -name "*.apk" -o -name "*.aab" 2>/dev/null | head -n 20 || true
          mkdir -p build/app/outputs/flutter-apk/
          # copy any APKs found into expected dir
          find . -path ./build/app/outputs/flutter-apk -prune -o -name "*release.apk" -print 2>/dev/null | while read apk; do
            echo "Copying $apk"
            cp "$apk" build/app/outputs/flutter-apk/ 2>/dev/null || true
          done
          echo "=== Final APKs (Android 16 / API 36) ==="
          ls -lh build/app/outputs/flutter-apk/ || echo "NO APK DIR"
          if ! ls build/app/outputs/flutter-apk/*.apk >/dev/null 2>&1; then
            echo "::error ::No APKs produced"
            exit 1
          fi
          for apk in build/app/outputs/flutter-apk/*.apk; do
            size=$(stat -c%s "$apk")
            echo "$apk : $size bytes"
            if [ "$size" -gt 41943040 ]; then
              echo "::warning ::$apk exceeds 40MB target"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release-android16
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
